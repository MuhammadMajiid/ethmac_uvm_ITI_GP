
<style>
  :root { --gap: 12px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .top-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 0 10px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    flex-wrap: wrap;
  }
  .top-bar h2 { font-size: 15px; font-weight: 500; color: var(--color-text-primary); flex: 1; min-width: 180px; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    font-size: 11px; font-weight: 500; padding: 4px 10px;
    border-radius: 20px; cursor: pointer; border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-primary); color: var(--color-text-secondary);
    transition: all .15s;
  }
  .pill.active { background: var(--color-background-tertiary); color: var(--color-text-primary); border-color: var(--color-border-primary); }
  .pill:hover { border-color: var(--color-border-primary); }

  .search-wrap { position: relative; }
  .search-wrap input { padding: 6px 10px 6px 30px; font-size: 13px; width: 220px; border-radius: var(--border-radius-md); }
  .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--color-text-tertiary); pointer-events: none; }

  .stats-row { display: flex; gap: 10px; margin: 12px 0 8px; flex-wrap: wrap; }
  .stat-chip {
    font-size: 11px; padding: 4px 10px; border-radius: var(--border-radius-md);
    background: var(--color-background-secondary); color: var(--color-text-secondary);
    border: 0.5px solid var(--color-border-tertiary);
  }
  .stat-chip b { color: var(--color-text-primary); font-weight: 500; }

  .tc-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }

  .tc-card {
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    background: var(--color-background-primary);
    overflow: hidden; cursor: pointer;
    transition: border-color .15s;
  }
  .tc-card:hover { border-color: var(--color-border-secondary); }
  .tc-card.open { border-color: var(--color-border-primary); }

  .tc-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; user-select: none;
  }
  .tc-name { font-size: 13px; font-weight: 500; color: var(--color-text-primary); flex: 1; font-family: var(--font-mono); }
  .tc-title { font-size: 12px; color: var(--color-text-secondary); flex: 2; }

  .badge {
    font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 20px;
    white-space: nowrap; flex-shrink: 0;
  }
  .b-reg  { background: #E6F1FB; color: #0C447C; }
  .b-tx   { background: #EAF3DE; color: #27500A; }
  .b-rx   { background: #FAEEDA; color: #633806; }
  .b-miim { background: #EEEDFE; color: #3C3489; }
  .b-addr { background: #FAECE7; color: #712B13; }
  .b-fc   { background: #E1F5EE; color: #085041; }
  .b-hd   { background: #FBEAF0; color: #72243E; }
  .b-int  { background: #F1EFE8; color: #444441; }
  .b-rst  { background: #FCEBEB; color: #791F1F; }
  .b-str  { background: #FAC775; color: #412402; }

  .dark-badge { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
  @media (prefers-color-scheme: dark) {
    .b-reg  { background: #0C447C; color: #B5D4F4; }
    .b-tx   { background: #27500A; color: #C0DD97; }
    .b-rx   { background: #633806; color: #FAC775; }
    .b-miim { background: #3C3489; color: #CECBF6; }
    .b-addr { background: #712B13; color: #F5C4B3; }
    .b-fc   { background: #085041; color: #9FE1CB; }
    .b-hd   { background: #72243E; color: #F4C0D1; }
    .b-int  { background: #444441; color: #D3D1C7; }
    .b-rst  { background: #791F1F; color: #F7C1C1; }
    .b-str  { background: #633806; color: #FAC775; }
  }

  .chevron { font-size: 12px; color: var(--color-text-tertiary); transition: transform .2s; flex-shrink: 0; }
  .tc-card.open .chevron { transform: rotate(180deg); }

  .tc-body { display: none; padding: 0 14px 14px; border-top: 0.5px solid var(--color-border-tertiary); margin-top: 0; }
  .tc-card.open .tc-body { display: block; }

  .section-label {
    font-size: 10px; font-weight: 500; letter-spacing: .06em;
    color: var(--color-text-tertiary); text-transform: uppercase;
    margin: 12px 0 6px;
  }
  .desc { font-size: 13px; color: var(--color-text-secondary); line-height: 1.6; margin-bottom: 4px; }

  .comp-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .comp-tag {
    font-size: 11px; padding: 3px 9px; border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-secondary);
    color: var(--color-text-secondary); font-family: var(--font-mono);
  }
  .comp-tag.agent { border-color: #B5D4F4; color: #185FA5; background: #E6F1FB; }
  .comp-tag.seq   { border-color: #9FE1CB; color: #0F6E56; background: #E1F5EE; }
  .comp-tag.scb   { border-color: #CECBF6; color: #534AB7; background: #EEEDFE; }
  .comp-tag.ral   { border-color: #F5C4B3; color: #993C1D; background: #FAECE7; }
  .comp-tag.mem   { border-color: #F4C0D1; color: #993556; background: #FBEAF0; }
  .comp-tag.cov   { border-color: #FAC775; color: #854F0B; background: #FAEEDA; }
  @media (prefers-color-scheme: dark) {
    .comp-tag.agent { border-color: #185FA5; color: #85B7EB; background: #042C53; }
    .comp-tag.seq   { border-color: #0F6E56; color: #5DCAA5; background: #04342C; }
    .comp-tag.scb   { border-color: #534AB7; color: #AFA9EC; background: #26215C; }
    .comp-tag.ral   { border-color: #993C1D; color: #F0997B; background: #4A1B0C; }
    .comp-tag.mem   { border-color: #993556; color: #ED93B1; background: #4B1528; }
    .comp-tag.cov   { border-color: #854F0B; color: #EF9F27; background: #412402; }
  }

  .flow-steps { display: flex; flex-direction: column; gap: 0; margin-bottom: 4px; }
  .flow-step {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 6px 0;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    font-size: 12px; color: var(--color-text-secondary); line-height: 1.5;
  }
  .flow-step:last-child { border-bottom: none; }
  .step-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--color-background-tertiary);
    color: var(--color-text-secondary); font-size: 10px; font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .step-actor {
    font-family: var(--font-mono); font-size: 11px; color: var(--color-text-tertiary);
    min-width: 110px; flex-shrink: 0; padding-top: 2px;
  }
  .step-action { flex: 1; }
  .step-action code { font-family: var(--font-mono); font-size: 11px; background: var(--color-background-tertiary); padding: 1px 4px; border-radius: 3px; color: var(--color-text-primary); }

  .check-grid { display: flex; flex-direction: column; gap: 4px; }
  .check-item { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: var(--color-text-secondary); line-height: 1.5; }
  .check-item i { color: var(--color-text-success); margin-top: 2px; flex-shrink: 0; font-size: 13px; }

  .no-results { padding: 32px; text-align: center; color: var(--color-text-tertiary); font-size: 13px; }
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden">Ethernet MAC UVM Testcase Reference — detailed flow for each test case including components, sequence of steps, and pass criteria</h2>

<div class="top-bar">
  <h2>Ethernet MAC — UVM testcase reference</h2>
  <div class="search-wrap">
    <i class="ti ti-search search-icon" aria-hidden="true"></i>
    <input type="text" id="search" placeholder="Search tests..." oninput="renderList()">
  </div>
</div>

<div class="filters" id="filters" style="margin-top:10px"></div>

<div class="stats-row" id="stats-row"></div>

<div class="tc-list" id="tc-list"></div>

<script>
const GROUPS = {
  reg:  { label: 'Registers & BD', cls: 'b-reg' },
  miim: { label: 'MIIM',           cls: 'b-miim' },
  tx:   { label: 'TX',             cls: 'b-tx' },
  rx:   { label: 'RX',             cls: 'b-rx' },
  addr: { label: 'Address recog',  cls: 'b-addr' },
  fc:   { label: 'Flow control',   cls: 'b-fc' },
  hd:   { label: 'Half-duplex',    cls: 'b-hd' },
  int:  { label: 'Interrupts',     cls: 'b-int' },
  rst:  { label: 'Reset & clock',  cls: 'b-rst' },
  str:  { label: 'Stress',         cls: 'b-str' },
};

const TC = [
  {
    id: 'tc_reg_reset_values', group: 'reg',
    title: 'Verify all register reset values',
    desc: 'After asserting RST_I, every one of the 21 configuration registers must read back its documented reset value as per the specification. Uses the UVM RAL built-in reset sequence so no manual register reads are needed.',
    components: [
      {name:'wb_slave_agent',type:'agent'},{name:'eth_reg_block (RAL)',type:'ral'},
      {name:'uvm_reg_hw_reset_seq',type:'seq'},{name:'eth_coverage',type:'cov'},
    ],
    steps: [
      {actor:'Test',           action:'Assert <code>RST_I=1</code> for 5 clock cycles via <code>wb_slave_agent</code>'},
      {actor:'Test',           action:'Deassert <code>RST_I=0</code>, wait 2 clock cycles'},
      {actor:'uvm_reg_hw_reset_seq', action:'Iterates every register in <code>eth_reg_block</code>; calls <code>reg.read()</code> via frontdoor WISHBONE'},
      {actor:'wb_slave_driver',action:'Drives <code>ADDR_I, WE_I=0, STB_I, CYC_I</code>; waits for <code>ACK_O</code>'},
      {actor:'RAL predictor', action:'Compares read value against <code>reg.get_reset()</code> for every field'},
      {actor:'eth_coverage',  action:'Samples <code>reg_reset_cg</code> covergroup — all register names'},
    ],
    checks: [
      'MODER reset = 0x0000_A000 (NOPRE, NOBCKOF, FULLD bits check)',
      'IPGT reset = 0x12, IPGR1 = 0x0C, IPGR2 = 0x12',
      'PACKETLEN reset = 0x0040_0600',
      'COLLCONF reset = 0x000F_003F',
      'TX_BD_NUM reset = 0x40',
      'MIIMODER reset = 0x64',
      'All status/interrupt regs (INT_SOURCE, MIISTATUS) reset = 0x0',
      'uvm_reg_hw_reset_seq reports zero mismatches',
    ],
  },
  {
    id: 'tc_reg_walking_one', group: 'reg',
    title: 'Walking-1 across all RW register bits',
    desc: 'Shifts a single 1-bit through every RW-accessible bit position in every register. For each bit position: write 1 to that bit only, read back, verify; then restore to reset value. Uses uvm_reg_bit_bash_seq.',
    components: [
      {name:'wb_slave_agent',type:'agent'},{name:'eth_reg_block (RAL)',type:'ral'},
      {name:'uvm_reg_bit_bash_seq',type:'seq'},
    ],
    steps: [
      {actor:'uvm_reg_bit_bash_seq', action:'For each RW register: writes all zeros (frontdoor), reads back, checks'},
      {actor:'uvm_reg_bit_bash_seq', action:'For each RW bit position N: writes <code>1 << N</code>, reads back'},
      {actor:'wb_slave_driver',      action:'Each write: drives ADDR_I=reg_offset, DATA_I=value, WE_I=1, STB_I, CYC_I; waits ACK_O'},
      {actor:'RAL predictor',        action:'Verifies read data matches written value; flags W1C or read-only bits that differ'},
      {actor:'uvm_reg_bit_bash_seq', action:'Writes all ones, reads back; checks RO bits unchanged, RW bits set'},
    ],
    checks: [
      'Every RW bit in all 21 registers accepts 0→1 and 1→0 transitions',
      'Read-only bits (MIIRX_DATA[15:0], MIISTATUS[2:0]) never change on write',
      'No ERR_O asserted for valid register addresses with SEL_I=4\'hF',
      'ERR_O asserted when SEL_I ≠ 4\'hF on any register access',
    ],
  },
  {
    id: 'tc_bd_walking_one', group: 'reg',
    title: 'Walking-1 across BD RAM (0x400–0x7FF)',
    desc: 'Exercises all 1024 bytes of the internal BD RAM using uvm_mem_walk_seq. Verifies that the RAM correctly stores and returns data at every address without corruption. BD RAM is only accessible when the MAC is not in reset.',
    components: [
      {name:'wb_slave_agent',type:'agent'},{name:'eth_bd_mem (uvm_mem)',type:'mem'},
      {name:'uvm_mem_walk_seq',type:'seq'},
    ],
    steps: [
      {actor:'Test',            action:'Ensure MAC is not in reset (RST bit in MODER cleared)'},
      {actor:'uvm_mem_walk_seq',action:'Writes walking-1 pattern to every 32-bit word from offset 0x400 to 0x7FC'},
      {actor:'wb_slave_driver', action:'Each write: ADDR_I = 0x400+offset, DATA_I = pattern, WE_I=1, SEL_I=0xF'},
      {actor:'uvm_mem_walk_seq',action:'Reads back every location and compares'},
      {actor:'Test',            action:'Assert RST_I, then read BD RAM — verify values preserved (design spec section 3.4.1)'},
    ],
    checks: [
      'All 256 32-bit words (0x400–0x7FC) store and return correct values',
      'No ACK timeout for any BD address within 0x400–0x7FF range',
      'Addresses outside 0x400–0x7FF do not alias into BD RAM',
      'RAM values preserved across soft reset (RST_I) as per spec',
      'READY bit (RD/E) prevents host access once set — verify ERR_O or no effect when written',
    ],
  },
  {
    id: 'tc_bd_tx_num_split', group: 'reg',
    title: 'TX_BD_NUM splits BD space correctly',
    desc: 'Writes 0x32 (50) to TX_BD_NUM register and verifies that exactly 50 TX BDs are accessible at 0x400–0x58C and 78 RX BDs are accessible at 0x590–0x7FC. Tests the boundary address for each region.',
    components: [
      {name:'wb_slave_agent',type:'agent'},{name:'eth_reg_block (RAL)',type:'ral'},
      {name:'eth_bd_mem (uvm_mem)',type:'mem'},{name:'eth_tx_bd_num_seq',type:'seq'},
    ],
    steps: [
      {actor:'eth_tx_bd_num_seq', action:'Write TX_BD_NUM = 0x32 via RAL frontdoor'},
      {actor:'eth_tx_bd_num_seq', action:'Write all 50 TX BDs: address range 0x400 to 0x58C (8 bytes each × 50 = 0x190)'},
      {actor:'eth_tx_bd_num_seq', action:'Write all 78 RX BDs: address range 0x590 to 0x7FC'},
      {actor:'eth_tx_bd_num_seq', action:'Read back all 128 BDs and verify no overlap or corruption'},
      {actor:'Test',              action:'Write TX_BD_NUM = 0x80 (all TX): verify RXEN auto-disabled in MODER'},
      {actor:'Test',              action:'Write TX_BD_NUM = 0x00 (all RX): verify TXEN auto-disabled in MODER'},
    ],
    checks: [
      'TX BD at 0x400 (first) and 0x58C (last) correctly stored and read',
      'RX BD at 0x590 (first) and 0x7FC (last) correctly stored and read',
      'RXEN auto-disables when TX_BD_NUM = 0x80',
      'TXEN auto-disables when TX_BD_NUM = 0x00',
      'Values > 0x80 are ignored (register retains previous value)',
    ],
  },

  {
    id: 'tc_miim_write_phy_reg', group: 'miim',
    title: 'Write to PHY register via MIIM',
    desc: 'Programs a PHY configuration register by setting up MIIADDRESS, MIITX_DATA, then asserting WCTRLDATA in MIICOMMAND. Verifies the full 64-bit MIIM frame appears on the MDC/MDIO interface with correct preamble, address, and data fields.',
    components: [
      {name:'wb_slave_agent',type:'agent'},{name:'mdio_agent',type:'agent'},
      {name:'eth_reg_block (RAL)',type:'ral'},{name:'eth_miim_write_seq',type:'seq'},
      {name:'mdio_monitor',type:'agent'},{name:'eth_scoreboard',type:'scb'},
    ],
    steps: [
      {actor:'eth_miim_write_seq', action:'RAL write: MIIMODER.CLKDIV = 0x28 (MDC = CLK/40)'},
      {actor:'eth_miim_write_seq', action:'RAL write: MIIADDRESS.FIAD = 0x01 (PHY addr), RGAD = 0x00 (control reg)'},
      {actor:'eth_miim_write_seq', action:'RAL write: MIITX_DATA.CTRLDATA = 0x2100 (reset + loopback)'},
      {actor:'eth_miim_write_seq', action:'RAL write: MIICOMMAND.WCTRLDATA = 1'},
      {actor:'wb_slave_driver',    action:'Issues all four WISHBONE write cycles with ACK_O handshake'},
      {actor:'mdio_monitor',       action:'Captures MDC edges and samples MDIO bit stream'},
      {actor:'mdio_monitor',       action:'Decodes: 32-bit preamble(1s), ST=01, OP=01(write), FIAD, RGAD, TA=10, DATA'},
      {actor:'eth_miim_write_seq', action:'Poll MIISTATUS.BUSY via RAL read until cleared'},
      {actor:'mdio_agent',         action:'Simulates PHY acknowledging write (drives MDIO during TA)'},
      {actor:'eth_scoreboard',     action:'Verifies decoded frame fields match programmed values'},
    ],
    checks: [
      'MDIO preamble = 32 ones (unless MIINOPRE set)',
      'ST field = 2\'b01',
      'OP field = 2\'b01 for write',
      'FIAD[4:0] matches MIIADDRESS.FIAD written',
      'RGAD[4:0] matches MIIADDRESS.RGAD written',
      'TA = 2\'b10 for write',
      'DATA[15:0] matches MIITX_DATA.CTRLDATA',
      'MIISTATUS.BUSY deasserts at end of operation',
    ],
  },
  {
    id: 'tc_miim_clkdiv_all', group: 'miim',
    title: 'Test all 255 CLKDIV values',
    desc: 'Iterates through all valid CLKDIV values (1–255) and for each value triggers a MIIM read operation, measures the MDC frequency, and verifies it equals CLK/(2×CLKDIV).',
    components: [
      {name:'wb_slave_agent',type:'agent'},{name:'mdio_agent',type:'agent'},
      {name:'eth_reg_block (RAL)',type:'ral'},{name:'eth_miim_clkdiv_seq',type:'seq'},
    ],
    steps: [
      {actor:'eth_miim_clkdiv_seq', action:'For CLKDIV = 1 to 255: RAL write to MIIMODER.CLKDIV'},
      {actor:'eth_miim_clkdiv_seq', action:'Trigger MIICOMMAND.RSTAT = 1 to start a read operation'},
      {actor:'mdio_monitor',        action:'Measures MDC period: records rising edge timestamps, computes frequency'},
      {actor:'mdio_monitor',        action:'Verifies MDC_freq = SYS_CLK_freq / (2 × CLKDIV) ± 1 cycle tolerance'},
      {actor:'eth_miim_clkdiv_seq', action:'Wait for BUSY = 0 before next iteration'},
    ],
    checks: [
      'MDC frequency matches formula for all 255 values',
      'No MDC glitches (spurious edges) between operations',
      'BUSY correctly asserted for full duration of each read',
      'CLKDIV=0 treated as 1 or ignored (per implementation)',
    ],
  },
  {
    id: 'tc_miim_scan_linkfail', group: 'miim',
    title: 'Scan status — LINKFAIL detection',
    desc: 'Asserts SCANSTAT in MIICOMMAND to start continuous PHY status polling. The mdio_agent (PHY model) first returns link-OK, then drives LINKFAIL=1 in the status register. Verifies MIISTATUS.LINKFAIL reflects the PHY state and NVALID clears after first scan completes.',
    components: [
      {name:'wb_slave_agent',type:'agent'},{name:'mdio_agent',type:'agent'},
      {name:'eth_reg_block (RAL)',type:'ral'},{name:'eth_miim_scan_seq',type:'seq'},
    ],
    steps: [
      {actor:'eth_miim_scan_seq', action:'Write MIICOMMAND.SCANSTAT = 1; MIIADDRESS.FIAD = PHY_ADDR'},
      {actor:'mdio_agent',        action:'First scan response: bit[2]=1 (link OK) in PHY status register'},
      {actor:'eth_miim_scan_seq', action:'RAL read MIISTATUS: verify NVALID=1 (invalid until first scan done)'},
      {actor:'mdio_monitor',      action:'Detects end of first scan frame; NVALID should clear'},
      {actor:'eth_miim_scan_seq', action:'RAL read MIISTATUS: verify NVALID=0, LINKFAIL=0'},
      {actor:'mdio_agent',        action:'Second scan response: bit[2]=0 (link fail) in PHY status register'},
      {actor:'eth_miim_scan_seq', action:'RAL read MIISTATUS: verify LINKFAIL=1'},
      {actor:'eth_miim_scan_seq', action:'Write MIICOMMAND = 0x00 to stop scan; verify BUSY deasserts'},
    ],
    checks: [
      'NVALID=1 until first complete scan frame received',
      'NVALID=0 after first scan completes',
      'LINKFAIL tracks PHY bit[2] of status register',
      'BUSY stays asserted during entire scan operation',
      'BUSY deasserts only after scan explicitly stopped',
    ],
  },

  {
    id: 'tc_tx_basic_frame', group: 'tx',
    title: 'Transmit single minimum-length frame',
    desc: 'Transmits a single 64-byte Ethernet frame. The wb_master_agent holds the frame bytes in its SRAM. A TX BD is programmed pointing to that SRAM address. After TXEN=1, the DUT reads the frame via WISHBONE master and transmits nibbles on MTxD. The mii_agent captures and reassembles the full frame.',
    components: [
      {name:'wb_slave_agent',type:'agent'},{name:'wb_master_agent',type:'agent'},
      {name:'mii_agent',type:'agent'},{name:'eth_reg_block (RAL)',type:'ral'},
      {name:'eth_bd_mem (uvm_mem)',type:'mem'},{name:'eth_tx_frame_seq',type:'seq'},
      {name:'eth_scoreboard',type:'scb'},{name:'eth_coverage',type:'cov'},
    ],
    steps: [
      {actor:'eth_tx_frame_seq', action:'Write 64 bytes of frame data into wb_master_agent SRAM at address 0x0000_1000 (backdoor write to SRAM model)'},
      {actor:'eth_tx_frame_seq', action:'RAL write MODER: TXEN=0, CRCEN=1, PAD=1, FULLD=0 (configure before enable)'},
      {actor:'eth_tx_frame_seq', action:'Program TX BD at 0x400: LEN=64, CRC=1, PAD=1, IRQ=1, WR=1, RD=0'},
      {actor:'eth_tx_frame_seq', action:'Write TXPNT at 0x404 = 0x0000_1000'},
      {actor:'eth_tx_frame_seq', action:'Set TX BD RD=1 (ready bit) — this arms the transmitter'},
      {actor:'eth_tx_frame_seq', action:'RAL write MODER.TXEN = 1'},
      {actor:'DUT',              action:'Sees RD=1, issues WISHBONE master reads: M_ADDR_O=0x1000, M_WE_O=0'},
      {actor:'wb_master_agent',  action:'Responds to each read burst with frame bytes from SRAM, asserts M_ACK_I'},
      {actor:'DUT',              action:'Fills TX FIFO (16 words), begins transmitting: MTxEn=1, MTxD = preamble nibbles'},
      {actor:'mii_monitor',      action:'Captures MTxD stream: 14 nibbles preamble (0x5), 2 nibbles SFD (0xD), then data nibbles'},
      {actor:'DUT',              action:'Transmits data nibbles (LSB first), then 4-byte CRC nibbles; deasserts MTxEn'},
      {actor:'DUT',              action:'Writes TX BD: RD=0, RTRY=0, DF=0, CS=0; asserts INTA_O (IRQ=1)'},
      {actor:'eth_scoreboard',   action:'Reconstructs frame from captured MII nibbles; compares against original SRAM bytes'},
      {actor:'eth_scoreboard',   action:'Recalculates expected CRC-32; verifies appended CRC matches'},
    ],
    checks: [
      'Preamble = 7 bytes of 0x55, SFD = 0xD5',
      'Frame payload matches exactly what was written to SRAM',
      'CRC-32 appended and mathematically correct',
      'MTxEn deasserts on same cycle as last CRC nibble',
      'TX BD RD bit cleared to 0 after transmission',
      'INTA_O asserts and INT_SOURCE.TXB=1',
      'M_WE_O=0 for all DMA reads (read-only on TX path)',

let activeGroup = 'all';

function renderFilters() {
  const f = document.getElementById('filters');
  const total = TC.length;
  let html = `<span class="pill ${activeGroup==='all'?'active':''}" onclick="setGroup('all')">All (${total})</span>`;
  for (const [k,v] of Object.entries(GROUPS)) {
    const cnt = TC.filter(t=>t.group===k).length;
    html += `<span class="pill ${activeGroup===k?'active':''}" onclick="setGroup('${k}')">${v.label} (${cnt})</span>`;
  }
  f.innerHTML = html;
}

function setGroup(g) {
  activeGroup = g;
  renderFilters();
  renderList();
}

function renderStats(visible) {
  const s = document.getElementById('stats-row');
  const byGroup = {};
  visible.forEach(t => { byGroup[t.group] = (byGroup[t.group]||0)+1; });
  let html = `<span class="stat-chip">Showing <b>${visible.length}</b> of <b>${TC.length}</b> tests</span>`;
  if (activeGroup !== 'all') {
    html += `<span class="stat-chip"><b>${visible.length}</b> ${GROUPS[activeGroup]?.label} tests</span>`;
  }
  s.innerHTML = html;
}

function renderList() {
  const q = document.getElementById('search').value.toLowerCase();
  const visible = TC.filter(t => {
    const matchGroup = activeGroup === 'all' || t.group === activeGroup;
    const matchSearch = !q || t.id.includes(q) || t.title.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q);
    return matchGroup && matchSearch;
  });
  renderStats(visible);

  const list = document.getElementById('tc-list');
  if (!visible.length) {
    list.innerHTML = '<div class="no-results">No tests match your search.</div>';
    return;
  }

  list.innerHTML = visible.map(tc => {
    const g = GROUPS[tc.group];
    return `
<div class="tc-card" id="card-${tc.id}" onclick="toggle('${tc.id}')">
  <div class="tc-header">
    <span class="tc-name">${tc.id}</span>
    <span class="tc-title">${tc.title}</span>
    <span class="badge ${g.cls}">${g.label}</span>
    <i class="ti ti-chevron-down chevron" aria-hidden="true"></i>
  </div>
  <div class="tc-body">
    <p class="desc" style="margin-top:12px">${tc.desc}</p>

    <p class="section-label">Components used</p>
    <div class="comp-grid">
      ${tc.components.map(c=>`<span class="comp-tag ${c.type}">${c.name}</span>`).join('')}
    </div>

    <p class="section-label">Test flow</p>
    <div class="flow-steps">
      ${tc.steps.map((s,i)=>`
        <div class="flow-step">
          <span class="step-num">${i+1}</span>
          <span class="step-actor">${s.actor}</span>
          <span class="step-action">${s.action}</span>
        </div>`).join('')}
    </div>

    <p class="section-label">Pass criteria</p>
    <div class="check-grid">
      ${tc.checks.map(c=>`
        <div class="check-item">
          <i class="ti ti-circle-check" aria-hidden="true"></i>
          <span>${c}</span>
        </div>`).join('')}
    </div>
  </div>
</div>`;
  }).join('');
}

function toggle(id) {
  const card = document.getElementById('card-'+id);
  card.classList.toggle('open');
}

renderFilters();
renderList();
</script>
